{% load static %}

<!-- Pop a News Modal Content -->
 {% if pop_notification %}
 <!-- {% block pop-a-news %} {% endblock %} -->
<div class="lity-content lity-content--pop-a-news">
      <div class="lity-content-inner flex flex-col items-center">
        <h2 class="lity-content-title text-3xl font-bold mb-4">
          Pop a News
        </h2>
        <p class="lity-content-desc text-center mb-6">
          Subscribe to our newsletter to get the latest news and updates.
        </p>
        <form
          class="lity-content-form flex flex-col items-center w-full max-w-sm"
          action="#"
          method="post"
        >
          <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
            class="w-full px-4 py-2 mb-4 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <button
            type="submit"
            class="px-6 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition duration-300"
          >
            Subscribe
          </button>
        </form>
      </div>
</div>
{% endif %}
