{% load static %}

<section class="lqd-section clients pt-40 pb-55 bg-gray-100">
  <div class="container">
    <div class="row">
      <div class="col col-lg-12">
        <div class="ld-fancy-heading relative text-center">
          <p class="ld-fh-element mb-0/5em inline-block relative">
            We have our forum offices in four (4) different locations
            across the state:
          </p>
        </div>
        <div class="w-full block pt-50">
          <div class="carousel-container relative carousel-nav-shaped">
            <div
              class="carousel-items relative lqd-fade-sides"
              data-lqd-flickity='{"marquee": true, "equalHeightCells": true, "middleAlignContent": true, "pauseAutoPlayOnHover": true}'
            >
              <div class="flickity-viewport relative w-full overflow-hidden">
                <div
                  class="flickity-slider text-center flex w-full h-full relative"
                >
                  <div
                    class="col col-4 col-md-3 w-20percent carousel-item flex flex-col justify-center items-center"
                  >
                    <img
                      src="{% static 'kg/assets/images/demo/company/our-office.png' %}"
                      alt="intro-our-office-portrait"
                      width="80"
                      height="64"
                    />
                  </div>
                  <div
                    class="col col-4 col-md-3 w-20percent carousel-item flex flex-col justify-center items-center"
                  >
                    <img
                      src="{% static 'kg/assets/images/demo/company/kogi-west.png' %}"
                      alt="kogi-west-portrait"
                      width="121"
                      height="23"
                    />
                  </div>
                  <div
                    class="col col-4 col-md-3 w-20percent carousel-item flex flex-col justify-center items-center"
                  >
                    <img
                      src="{% static 'kg/assets/images/demo/company/kogi-east.png' %}"
                      alt="dhl"
                      width="121"
                      height="23"
                    />
                  </div>
                  <div
                    class="col col-4 col-md-3 w-20percent carousel-item flex flex-col justify-center items-center"
                  >
                    <img
                      src="{% static 'kg/assets/images/demo/company/kogi-lokoja.png' %}"
                      alt="kogi-lokoja-portrait"
                      width="121"
                      height="23"
                    />
                  </div>
                  <div
                    class="col col-4 col-md-3 w-20percent carousel-item flex flex-col justify-center items-center"
                  >
                    <img
                      src="{% static 'kg/assets/images/demo/company/kogi-central.png' %}"
                      alt="kogi-central-portriat"
                      width="121"
                      height="23"
                    />
                  </div>
                  <div
                    class="col col-4 col-md-3 w-20percent carousel-item flex flex-col justify-center items-center"
                  >
                    <img
                      src="{% static 'kg/assets/images/demo/company/our-office.png' %}"
                      alt="intro-our-office-portrait"
                      width="80"
                      height="64"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
