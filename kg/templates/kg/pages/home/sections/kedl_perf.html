{% load static %}

<section
  class="lqd-section what-we-do py-10 ca-initvalues-applied lqd-animations-done"
  data-custom-animations="true"
  data-ca-options='{"triggerHandler":"inview","animationTarget":".col","duration":"1800","delay":"180","ease":"power4.out","direction":"forward","initValues":{"y":35,"transformOriginX":50,"transformOriginY":50,"transformOriginZ":"0px","opacity":0},"animations":{"y":0,"transformOriginX":50,"transformOriginY":50,"transformOriginZ":"0px","opacity":1}}'
  data-section-luminosity="light"
>
  <div class="container">
    <div class="row">
      <div class="w-full relative">
        <div class="lqd-fb pos-rel lqd-fb-style-1 lqd-fb-style-1-3 lqd-fb-content-overlay lqd-fb-zoom-img-onhover border-radius-4 overflow-hidden h-pt-60 mb-65 is-in-view" data-inview="true">
          <div class="lqd-fb-inner lqd-overlay">
            <div class="lqd-fb-img lqd-overlay overflow-hidden">
              <figure class="w-full h-full">
                <img class="w-full h-full objfit-cover objpos-center" src="{% static 'kg/assets/images/demo/company/kedl_performance.jpeg' %}" alt="KEDL Performance" width="1200" height="800" style="object-fit: contain; object-position: center;" />
              </figure>
            </div>
            <div class="lqd-fb-content lqd-overlay d-flex items-end">
              <div class="lqd-fb-bg lqd-overlay bg-transparent" style="background-image: linear-gradient(180deg, #181B3100 0%, #181B31 100%);"></div>
              <div class="lqd-fb-hover-overlay lqd-overlay"></div>
              <div class="lqd-fb-content-inner d-flex flex-col justify-between relative h-full w-full p-1/5rem">
                <div class="lqd-fb-content-top">
                  <h6 class="mt-0 mb-0" style="color: rgb(202, 143, 7);">KEDL Report</h6>
                </div>
                <div class="lqd-fb-content-bottom">
                  <h2 class="lqd-fb__title mt-0 mb-2 font-semibold" style="color:#c6b581;">Performance Overview</h2>
                  <p class="mt-0 mb-3" style="color:#e0d1a3;">KEDL Performance Overview for the month of May 2026.</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
