{% load static %}

{% if page_content and page_content.mini_grid_developer %}
<div class="w-full relative" id="mini-grid-developer">
      <h3 class="ld-fh-element relative mb-1em text-24">
          {{ page_content.mini_grid_developer.title }}
      </h3>
      {% for pg_content in page_content.mini_grid_developer.content %}
          <div class="w-full relative">
            <p class="ld-fh-element relative mb-1em">
              {{ pg_content|safe }}
            </p>
          </div>
      {% endfor %}  
  
  </div>
  {% endif %}
