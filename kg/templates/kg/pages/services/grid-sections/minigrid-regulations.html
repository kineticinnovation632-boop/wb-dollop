{% load static %}


{% if page_content and page_content.mini_grid_regulation %}
<div class="w-full relative" id="mini-grid-regulation">
  <h3 class="ld-fh-element relative mb-1em text-24">
          {{ page_content.mini_grid_regulation.title }}
      </h3>
      {% for pg_content in page_content.mini_grid_regulation.content %}
          <div class="w-full relative">
            <p class="ld-fh-element relative mb-1em">
              {{ pg_content|safe }}
            </p>
          </div>
      {% endfor %}  
</div>
{% endif %}
