{% load static %}


{% if page_content and page_content.what_is_a_mini_grid %}
<div class="w-full relative" id="what-is-mini-grid">
        <h3 class="ld-fh-element relative mb-1em text-24">
            {{ page_content.what_is_a_mini_grid.title }}
          </h3>
          <div class="w-full relative">
            <p class="ld-fh-element relative mb-1em">
              {% for pg_content in page_content.what_is_a_mini_grid.content %}
              {{ pg_content|safe}}
              {% endfor %}
            </p>
          </div>
        </div>
{% endif %}
